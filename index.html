<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="山林慢遊">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>山林慢遊 &amp; 美食饗宴｜感謝參加</title>
<style>
:root{--paper:#FFFBEF;--paper2:#F8F0D8;--ink:#2A2620;--sub:#5C5547;--line:#E2D6B4;--green:#3F6B2F;--green2:#E6F0D6;--brown:#7E4521;--orange:#D9771B;--orange2:#FFEBCF}
html{font-size:20px;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.7;background:linear-gradient(180deg,#cfe6f4 0,#e8f1e2 360px,var(--paper2) 700px);min-height:100vh}
.wrap{max-width:600px;margin:0 auto;padding:0 14px 30px}
.hero{position:relative;margin:14px 0 0;border-radius:22px;overflow:hidden;border:4px solid #fff;box-shadow:0 4px 14px rgba(70,50,10,.25);background:#fff}
.hero img{display:block;width:100%;height:auto}
.tag{position:absolute;left:0;top:14px;background:var(--brown);color:#fff;font-weight:800;padding:6px 16px 6px 14px;border-radius:0 999px 999px 0;font-size:.85rem}
.titlebox{margin:12px 0 0;position:relative;background:var(--paper);border-radius:18px;padding:14px 16px 12px;text-align:center;box-shadow:0 3px 12px rgba(70,50,10,.18);border:2px solid var(--line)}
.titlebox h1{margin:0;font-size:1.9rem;line-height:1.15;color:var(--green);font-weight:900;letter-spacing:.06em}
.titlebox h1 b{display:block;color:var(--brown)}
.titlebox p{margin:6px 0 0;color:var(--sub);font-size:.95rem}
.card{background:var(--paper);border-radius:18px;padding:16px;margin:14px 0;border:2px solid var(--line);box-shadow:0 2px 8px rgba(70,50,10,.10)}
.thx{font-size:1.4rem;font-weight:900;color:var(--green);line-height:1.4;margin-bottom:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.st{background:var(--orange2);border:2px dashed var(--orange);border-radius:14px;padding:10px;text-align:center}
.st b{display:block;font-size:1.5rem;color:var(--orange);line-height:1.2}
.st small{color:var(--sub);font-size:.85rem;font-weight:700}
.next{border:3px solid var(--green);background:var(--green2);border-radius:18px;padding:14px;text-align:center;font-weight:900;font-size:1.2rem;color:var(--green);line-height:1.5}
.next small{display:block;font-size:.9rem;color:var(--sub);font-weight:700}
.cap{font-size:.8rem;color:var(--sub);text-align:center;margin-top:6px}
.fs{display:flex;align-items:center;gap:6px;justify-content:center;margin:16px 0 4px;font-size:.85rem;color:var(--sub)}
.fs button{border:2px solid var(--green);background:#fff;color:var(--green);border-radius:12px;min-width:52px;min-height:48px;font:inherit;font-weight:800}
.fs button.on{background:var(--green);color:#fff}
html.fs-s{font-size:18px}html.fs-l{font-size:23px}html.fs-x{font-size:26px}
footer{text-align:center;color:var(--sub);font-size:.85rem;margin:20px 0 4px}
</style>
</head>
